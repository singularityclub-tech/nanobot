[project]
name = "singularity-cli"
version = "0.1.0"
description = "Typed Singularity backend helper for Nanobot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1,<0.29.0",
    "pydantic>=2.12.0,<3.0.0",
    "rich>=14.3.4,<15.0.0",
    "singularity-client",
    "typer>=0.24.2,<1.0.0",
]

[project.scripts]
singularity-cli = "singularity_cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.2.0,<2.0.0",
]

[tool.uv.sources]
singularity-client = { workspace = true }

[tool.uv.build-backend]
module-name = "singularity_cli"
module-root = "src"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"
